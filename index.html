<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6bbf59">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="content/assets/icon.png">
  <link rel="apple-touch-icon" href="content/assets/icon.png">
  <title>えほえほ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- すべての画面はここに描画される（js/app.js が切り替える）-->
  <main id="app" class="app">
    <!-- 起動中スプラッシュ。最初の画面が描画されると自動的に消える（innerHTML差し替え）-->
    <!-- 画面に出すアイコンは icon.webp（46KB）。png（455KB）だと、Wi-Fi経由のiPadで
         読み込み途中の「上半分だけ」が見えてしまう。ファビコン／ホーム画面用は png のまま。 -->
    <div class="screen center splash" aria-hidden="true">
      <img class="splash-icon" src="content/assets/icon.webp" alt="えほえほ">
      <span class="splash-dots"><i></i><i></i><i></i></span>
    </div>
  </main>

  <!-- 写真撮影用の隠し入力。iOS/Androidでは端末のカメラが開く。
       ファイル入力なので http（同一Wi-Fi）でも動く（getUserMediaと違いHTTPS不要）-->
  <input id="camera-input" type="file" accept="image/*" capture="environment" hidden>

  <!-- ページめくり演出（本物の紙をめくるような効果）。CDNを使わず同梱しているので、
       Wi-Fiがオフラインでも（serve.py経由なら）動く。 -->
  <script src="js/vendor/page-flip.browser.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
