<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101c36">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="content/assets/icon.png">
  <link rel="apple-touch-icon" href="content/assets/icon.png">
  <title>すきのたね</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=suki-no-tane-app-web-splash-20260822">
</head>
<body class="night-theme">
  <!-- すべての画面はここに描画される（js/app.js が切り替える）-->
  <main id="app" class="app">
    <!-- 起動中スプラッシュ。最初の画面が描画されると自動的に消える（innerHTML差し替え）-->
    <!-- 初期表示は白画面を防ぐための静止画。単独の App/Web は js/app.js が一度だけ動画に差し替え、
         website_company の source=company 埋め込みは静止画のままにする。 -->
    <div class="screen center splash" aria-hidden="true">
      <div class="splash-media">
        <img class="splash-icon" src="content/assets/logotitle_ver2.png" alt="すきのたね">
      </div>
      <span class="splash-dots"><i></i><i></i><i></i></span>
      <p class="splash-label">じゅんび中…</p>
    </div>
  </main>

  <!-- アプリ内カメラを使えない端末・環境向けのフォールバック入力。
       ファイル入力なので http（同一Wi-Fi）でも動く（getUserMediaと違いHTTPS不要）。-->
  <input id="camera-input" type="file" accept="image/*" capture="environment" hidden>

  <!-- ページめくり演出（本物の紙をめくるような効果）。CDNを使わず同梱しているので、
       Wi-Fiがオフラインでも（serve.py経由なら）動く。 -->
  <script src="js/vendor/page-flip.browser.js"></script>
  <script type="module" src="js/app.js?v=suki-no-tane-startup-media-20260822"></script>
</body>
</html>
